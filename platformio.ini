[platformio]
extra_configs =
	platformio.local.ini
; The 11 shipping environments, and the only ones a bare `pio run` builds. This
; list must match the matrix in .github/workflows/main.yaml and the per-env
; builds in .github/workflows/release.yml -- both of those name every env
; explicitly, so the diagnostic envs below can never reach CI or a release
; artifact. default_envs closes the remaining hole: a local or scripted
; `pio run` with no -e would otherwise build all of them.
;
; DIAGNOSTIC ENVS ARE DELIBERATELY ABSENT: nrf52840custom-debug,
; nrf52840-bootdiag, nrf52840-reformat, esp32-s3-N16R8-extuart-debug.
; Build them with an explicit `pio run -e <env>`. See each env's own header for
; why it must never ship.
;
; DO NOT ADD -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1. IT IS INERT HERE.
; It looks like the way to move the NimBLE HOST pools (msys mbufs, ACL-from-LL,
; HCI event buffers, ~14 KB) out of internal DRAM, and NimBLE-Arduino does compile
; from source, so unlike the WiFi/lwIP/mDNS allocations it looks reachable. It is
; not. Chain, verified 2026-08-03 by disassembling nimble_platform_mem_calloc:
;   1. exp_nimble_mem.c tests #ifdef CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL
;      FIRST, and only #elif ..._EXTERNAL after it.
;   2. nimconfig.h guards its own ..._INTERNAL define with
;      #ifndef ..._EXTERNAL -- which would work, except that
;   3. nimconfig.h includes sdkconfig.h first, and the Arduino prebuilt
;      sdkconfig.h (qio_opi/include/sdkconfig.h:589) defines
;      CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL 1 unconditionally.
; So INTERNAL is always defined by the time the shim is compiled and the -D
; changes nothing. The built code still calls
; heap_caps_calloc(..., MALLOC_CAP_INTERNAL|MALLOC_CAP_8BIT) -- confirmed
; identical on an env with the flag and one without (a12 = 4 + 0x800 = 0x804).
; A command-line -U cannot help: sdkconfig.h re-defines it after any -D/-U.
; This is the undiagnosed "I tried to uncomment, but there is no effect" in
; h2zero/NimBLE-Arduino#496. Only a rebuilt Arduino lib set would change it.
;
; If it were reachable it would ALSO require -DBOARD_HAS_PSRAM: the shim has NO
; fallback, so a part without PSRAM loses BLE entirely
; (h2zero/NimBLE-Arduino#317, espressif/esp-idf#8020 -- the proposed
; heap_caps_malloc_prefer fix was never merged).
default_envs =
	nrf52840custom
	esp32-s3-N16R8
	esp32-s3-N8R8
	esp32-s3-N32R8
	esp32-s3-N32R8-extuart
	esp32-s3-N16R8-extuart
	esp32-c3-N4
	esp32-c3-N16
	esp32-c6-N4
	esp32-N4
	esp32-s3-N4R2

[env]
lib_deps =
	; Pinned: bb_epaper has no releases, so an unpinned URL means CI and local
	; builds get whatever HEAD was at install time. Full SHA required: PlatformIO
	; shallow-fetches the #ref (`git fetch --depth=1 origin <ref>`), and GitHub
	; does not resolve abbreviated SHAs as refs. 5dccfbbf… is "Added support for
	; the Seeed reTerminal E1004 and its 13.3 Spectra6 1200x1600 panel" -- the
	; commit that landed E1004 upstream, replacing the limengdu fork pin.
	https://github.com/bitbank2/bb_epaper.git#5dccfbbf553a9b0fe2547cbc4e60138e1ff2fb43
	h2zero/NimBLE-Arduino@^2.5.0
extra_scripts =
	pre:scripts/factory_config_gen.py
build_src_filter =
  +<*>
  -<utilities/>

; Factory provisioning (scripts/factory_config_gen.py):
;   OPENDISPLAY_FACTORY_CONFIG_HEX="BD 00 01 ..." pio run -e <env>
;   OPENDISPLAY_FACTORY_CLEAR_CONFIG=1 pio run -e <env>
; Or: ./tools/provision_firmware.py build --env <env> [--version 1.4] [--config-hex ...]

[env:nrf52840custom]
extra_scripts =
	pre:scripts/factory_config_gen.py
	post:scripts/nrf_uf2_post.py
build_flags =
  -DTARGET_NRF
  ; Existing targets pin 32 KB zlib windows for backwards compatibility with
  ; legacy clients. New targets can omit this flag to use the library default of 9.
  ; -DOPENDISPLAY_ZLIB_WINDOW_BITS=15
  ; nRF keeps the zlib history window in static storage for deterministic allocation.
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=0
  ; Move the panel SPI off SPIM3 and onto SPIM2.
  ;
  ; The Adafruit core binds the global `SPI` object to an instance chosen by this
  ; macro (framework SPI.cpp): 0 (its default) gives SPIM3, 1 gives SPIM2. Only
  ; `SPI` matters here -- bb_epaper drives the panel through that global
  ; (arduino_io.inl `SPI.begin()`), and nothing in this firmware ever calls
  ; SPI1.begin(), so the instance this hands to SPI1 is left uninitialised.
  ;
  ; Why: SPIM3 is the only nRF52840 SPIM instance carrying anomalies 195 (keeps
  ; drawing current after disable; the nrfx workaround pokes 0x4002F004 on every
  ; uninit and never undoes it on re-init) and 198 (transmit data may be corrupted
  ; when another bus master touches the TX buffer's RAM block mid-transfer -- and
  ; the Arduino per-byte path makes that buffer a one-byte STACK local, contended
  ; by SoftDevice interrupts on every byte). Both workarounds in nrfx_spim.c are
  ; gated on `p_spim == NRF_SPIM3`, and 198's is compiled out entirely here because
  ; NRFX_SPIM3_NRF52840_ANOMALY_198_WORKAROUND_ENABLED is never defined. Moving to
  ; SPIM2 makes both inapplicable rather than worked around.
  ;
  ; Free of cost at our clock: SPIM2 tops out at 8 MHz and bbepInitIO already asks
  ; for exactly 8000000 (display_service.cpp), which setClockDivider maps to
  ; NRF_SPIM_FREQ_8M on either instance. It does forfeit the 16/32 MHz that only
  ; SPIM3 offers -- deliberately, since raising the panel clock increases the DMA
  ; bus pressure this flag exists to avoid.
  ;
  ; No pin change: the instance is swapped, PIN_SPI_* are not.
  ; No I2C conflict: Wire is TWIM0 and Wire1 is TWIM1 (Wire_nRF52.cpp), while
  ; SPIM2's block is shared only with SPIS2/SPI2, neither of which is used.
  ;
  ; VERIFY AFTER ANY PLATFORM UPDATE. This macro is consumed by the framework's
  ; SPI.cpp, not by our sources, so it only works if -D reaches the framework
  ; build. If it silently stops doing so we are back on SPIM3 with no error. Check
  ; with: pio run -e nrf52840custom -v 2>&1 | grep -c 'SPI_32MHZ_INTERFACE=1.*SPI\.cpp'
  -DSPI_32MHZ_INTERFACE=1
  ; Hardware watchdog timeout, seconds. 0 disables; valid range is 60..3600
  ; (enforced by a static_assert in src/watchdog_nrf.cpp).
  ;
  ; KNOWN GAP: 120 s is BELOW the single longest span the firmware cannot
  ; instrument -- a REFRESH_FULL on a 7-colour split-buffer panel sends the init
  ; sequence to BOTH controllers, and each of its 4 BUSY_WAIT entries can take
  ; 30 s, i.e. ~240 s inside one bbepRefresh() call. The per-entry-point feed in
  ; display_service.cpp (see odWatchdogFeed() call sites) still bounds the dog to
  ; that one call rather than that call plus everything preceding it, but at
  ; 120 s a HEALTHY refresh on that panel class will trip the watchdog mid-refresh.
  ; Chosen anyway on 2026-08-03 (see conversation); re-check before shipping to any
  ; 7-colour split-buffer panel. See docs/PLAN_NRF_HARDWARE_WATCHDOG_2026-08-01.md
  ; sections 3.2 and W-2 for the original 300 s derivation.
  ;
  ; The three other nRF envs inherit this via ${env:nrf52840custom.build_flags}.
  -DOPENDISPLAY_NRF_WDT_S=120
platform = https://github.com/maxgerhardt/platform-nordicnrf52
framework = arduino
board_build.variants_dir = variants
board_build.variant = nrf52840custom
board = xiaoblesense_adafruit
monitor_speed = 115200
build_src_filter = +<*> -<main_mbed.cpp> -<utilities/>
; NimBLE-Arduino is ESP32-only here; the nRF target uses Adafruit Bluefruit.
lib_ignore = NimBLE-Arduino

; nrf52840custom with DEBUG-level logging compiled in -- the nRF counterpart of
; esp32-s3-N16R8-extuart-debug. OD_LOG_LEVEL defaults to INFO, so every
; od_log_debug() is dead-code-eliminated and the config parse dump, the BLE RX/TX
; hex lines with their [BLE][Q:n] queue depth, and the DIRECT_WRITE progress /
; throughput lines ("DW complete: ... KB/s") are ABSENT from a normal build. This
; env turns them on. Debug build, not a shipping one: the strings and calls survive,
; and the serial time they cost is real.
;
; Output goes to the nRF52840 NATIVE USB CDC (Serial) at 115200. There is no
; OPENDISPLAY_LOG_UART path on this target -- main.cpp gates that on TARGET_ESP32 --
; so unlike the S3 extuart pair there is no separate wire to watch: a battery build
; with no USB host attached emits nothing.
;
; Headroom is not a concern: the INFO build sits at 254 KB of 811 KB flash.
;
; Not in .github/workflows/main.yaml, matching esp32-s3-N16R8-extuart-debug -- CI
; builds the 11 shipping envs only. Low bit-rot risk by construction: od_log_debug()
; is a runtime `if` on a compile-time constant, not an #if, so every debug format
; string is still type-checked by the 11 CI builds.
[env:nrf52840custom-debug]
extends = env:nrf52840custom
build_flags =
  ${env:nrf52840custom.build_flags}
  -DOD_LOG_LEVEL=OD_LOG_DEBUG

; NEVER SHIP. Destructive recovery image: erases the internal LittleFS region
; (0xED000-0xF4000) on every boot and skips loading configuration. Boot it once,
; then flash normal firmware. Links none of the OpenDisplay sources -- it is a
; standalone utility that happens to share this project's toolchain.
; Excluded from default_envs, CI and release; build with -e explicitly.
[env:nrf52840-reformat]
extends = env:nrf52840custom
lib_deps =
  Adafruit TinyUSB Library
build_src_filter =
  -<*>
  +<utilities/nrf52840_reformat/>

; NEVER SHIP. Full normal firmware with an earliest-setup USB gate and staged
; boot logs, to distinguish pre-setup faults from config, I/O and SoftDevice
; faults. OPENDISPLAY_BOOT_DIAG makes setup() BLOCK on `while (!Serial)` with no
; timeout: with no USB host attached the device never advertises, never drives
; the panel, and never reaches loop(). That is the point on a bench and fatal on
; a battery. Excluded from default_envs, CI and release; build with -e explicitly.
[env:nrf52840-bootdiag]
extends = env:nrf52840custom
build_flags =
  ${env:nrf52840custom.build_flags}
  -DOD_LOG_LEVEL=OD_LOG_DEBUG
  -DOPENDISPLAY_BOOT_DIAG=1


[env:esp32-s3-N16R8]
