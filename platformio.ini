  ${env:esp32-s3-N16R8-extuart.build_flags}
  -DOD_LOG_LEVEL=OD_LOG_DEBUG

; Soldered Inkplate 5 V2 / 10 — classic ESP32-WROVER-E (4 MB flash + 8 MB PSRAM).
; FastEPD owns the parallel bus/PMIC; no WiFi (same DRAM constraints as esp32-N4).
[env:esp32-wrover-e-N4R8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
lib_deps =
  ${env.lib_deps}
  bitbank2/FastEPD@^2.2.0
build_flags =
  -DTARGET_ESP32
  -DPIPE_SMALL_DRAM_WINDOW
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
  -DOPENDISPLAY_FASTEPD
  -Wl,--allow-multiple-definition
board_build.filesystem = littlefs
board = esp-wrover-kit
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_upload.maximum_ram_size = 327680
monitor_speed = 115200

[env:esp32-N4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
build_flags =
  -DTARGET_ESP32
  # Classic ESP32 (esp32dev) only: 320KB RAM has far less static DRAM than the
  # S3/C3/C6 parts, so the full 33-slot PIPE_WRITE reorder queue overflows
  # dram0_0_seg at link. Shrink the window/queue on THIS env only (see structs.h).
  -DPIPE_SMALL_DRAM_WINDOW
  #-DOPENDISPLAY_ZLIB_WINDOW_BITS=15
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
board_build.filesystem = littlefs
board = esp32dev
board_build.partitions = huge_app.csv
monitor_speed = 115200
