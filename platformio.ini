; Seeed reTerminal Sticky — ESP32-S3R8 (8 MB OPI PSRAM) + W25Q256 32 MB QSPI flash.
; Console/debug via onboard CH343P USB-UART (U0TXD=GPIO43, U0RXD=GPIO44), not native USB-CDC.
; Panel/bus pins come from runtime device config (bb_epaper path).
[env:esp32-s3-N32R8-extuart]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_flags =
  -DTARGET_ESP32
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
  -DOPENDISPLAY_LOG_UART
  -DOPENDISPLAY_LOG_UART_RX=44
  -DOPENDISPLAY_LOG_UART_TX=43
board_build.filesystem = littlefs
board = esp32-s3-devkitc-1
board_build.partitions = default_32MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = qspi_opi
board_upload.maximum_size = 33554432
board_upload.maximum_ram_size = 327680
board_upload.flash_size = 32MB
monitor_speed = 115200

; Seeed reTerminal E1004 — same hardware as N32R8-extuart; pinned bb_epaper for T133A01.
[env:esp32-s3-E1004]
extends = env:esp32-s3-N32R8-extuart
; Pin bb_epaper to limengdu PR bitbank2#32 (T133A01) until merged upstream.
lib_deps =
	https://github.com/limengdu/bb_epaper.git#95fd94afe39cd7db32bef7c70eea06d654264ff6
	h2zero/NimBLE-Arduino@^2.5.0
build_flags =
	${env:esp32-s3-N32R8-extuart.build_flags}
	-DOPENDISPLAY_ZLIB_WINDOW_BITS=15

; C3/C6 need Arduino-ESP32 3.x / IDF 5 (pioarduino). Stock PlatformIO `espressif32`
; (Arduino 2.x) does not link mbedtls CMAC (`mbedtls_cipher_cmac_*`) and on C6 also
; leaves CONFIG_BT_LE_CONTROLLER_NPL_OS_PORTING_SUPPORT on without the controller's
; r_os_mem* ROM symbols, so NimBLE-Arduino fails at link time.
[env:esp32-c3-N4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_flags = 
  -DTARGET_ESP32
  #-DOPENDISPLAY_ZLIB_WINDOW_BITS=15
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
board = esp32-c3-devkitm-1
monitor_speed = 115200

[env:esp32-c6-N4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_flags =
  -DTARGET_ESP32
  #-DOPENDISPLAY_ZLIB_WINDOW_BITS=15
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
  ; C6 sdkconfig sets CONFIG_BT_LE_CONTROLLER_NPL_OS_PORTING_SUPPORT, so
  ; NimBLE-Arduino skips compiling os_mempool and expects r_os_mem* from
  ; libble_app. Force-pull those objects — a single-pass link on GitHub
  ; Actions otherwise leaves the refs undefined.
  -lble_app
  -Wl,-u,r_os_mempool_init
  -Wl,-u,r_os_memblock_get
  -Wl,-u,r_os_memblock_put
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
board = esp32-c6-devkitm-1
monitor_speed = 115200

; Generic 16MB ESP32-C3, no PSRAM. All board specifics (panel, pins, and the
; optional battery latch via DEVICE_FLAG_BATTERY_LATCH) come from the runtime
; device config. DIO flash mode leaves GPIO12/13 free for general GPIO use
; (e.g. a battery-latch MOSFET).
[env:esp32-c3-N16]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_flags =
  -DTARGET_ESP32
  #-DOPENDISPLAY_ZLIB_WINDOW_BITS=15
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board = esp32-c3-devkitm-1
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200

