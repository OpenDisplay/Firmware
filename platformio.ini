; Debug logging on the same hardware. Not in default_envs and not in
; .github/firmware-targets.json -- like esp32-s3-N16R8-extuart-debug, this is a
; bench build, not a shipped target. Worth having here specifically because
; -extuart builds print no panic backtrace over USB (logging goes out GPIO43/44),
; so debug-level logs are the only running commentary during panel bring-up.
[env:esp32-s3-N32R8-extuart-debug]
extends = env:esp32-s3-N32R8-extuart
build_flags =
  ${env:esp32-s3-N32R8-extuart.build_flags}
  -DOD_LOG_LEVEL=OD_LOG_DEBUG

; The Seeed reTerminal E1004 has no env of its own: it is the same hardware as
; esp32-s3-N32R8-extuart, and its 13.3" Spectra6 panel is selected at runtime by
; panel_ic_type in the device config, not at build time. Flash it with
; esp32-s3-N32R8-extuart (or the -debug env above for bring-up).

; ESP targets pin pioarduino 55.03.39 (Arduino 3.3.9 / IDF 5.5.4), by exact version
; so it cannot drift CI vs local.
;
; DO NOT BUMP PAST IDF 5.5.4 until NimBLE-Arduino ships a release built against the
; newer IDF. NimBLE-Arduino 2.5.0 (latest, 2026-04-02) depends on IDF <= 5.5.4: IDF
; 5.5.5 drops the r_ prefix on the C6 mempool exports and moves them to libbt.a
; (r_os_mempool_init -> os_mempool_init, same for os_memblock_get/_put), while 2.5.0
; still calls the r_ names -- so esp32-c6-N4 fails to link on 55.03.311. Only C6 is
; affected (it alone uses the precompiled controller blob with its own NimBLE porting
; layer). See docs/FINDINGS_C6_NIMBLE_IDF555_MEMPOOL_ABI_2026-07-25.md.
;
; Stock PlatformIO `espressif32` (Arduino 2.x) lacks mbedtls CMAC and C6 NPL
; r_os_mem* wiring for NimBLE-Arduino.
[env:esp32-c3-N4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
build_flags =
  -DTARGET_ESP32
  ; -DOPENDISPLAY_ENABLE_WIFI deliberately absent: no PSRAM here (see src/wifi_service.h).
  ; BLE-only, and the inflate engine falls back to uzlib.
  #-DOPENDISPLAY_ZLIB_WINDOW_BITS=15
  -DOPENDISPLAY_ZLIB_USE_HEAP_WINDOW=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_FREERTOS_WATCHDOG_TIMEOUT_S=120
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
board = esp32-c3-devkitm-1
monitor_speed = 115200

[env:esp32-c6-N4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
