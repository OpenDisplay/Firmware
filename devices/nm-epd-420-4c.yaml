# NM-EPD-420-4C — OpenDisplay device config (RockBase IoT, ESP32-S3)
#
# 4.2" four-colour (B/W/R/Y) variant. Same PCB and same pin map as the
# tri-colour NM-EPD-420 and the B/W NM-EPD-420-BW; only the fitted panel
# differs, so only `panel_ic_type` / `color_scheme` / `full_update_mC` change
# between the three variants.
#
# Encode to a config packet and flash it in, either as a factory config:
#
#   uv run tools/od-device-cli.py encode-config --input devices/nm-epd-420-4c.yaml
#   OPENDISPLAY_FACTORY_CONFIG_HEX="<hex>" pio run -e esp32-s3-N16R8
#
# or over BLE onto a running device:
#
#   uv run tools/od-device-cli.py write-config --addr AA:BB:CC:DD:EE:FF \
#       --input devices/nm-epd-420-4c.yaml
#
# Build target: esp32-s3-N16R8 (ESP32-S3, 16 MB QIO flash, 8 MB OPI PSRAM).
# No dedicated env: the NM-EPD-420 is exactly what that env already targets.
version: 1

system_config:
  ic_type: 2              # OD_IC_TYPE_ESP32S3
  communication_modes: 0x1   # BLE. Wi-Fi/LAN would add 0x4 (esp32-s3-N16R8 builds OPENDISPLAY_ENABLE_WIFI).
  # bit5 (0x20) = OD_DEVICE_FLAG_NM420_INIT: firmware drives the board's unused
  # peripheral enable/gate pins LOW right after config load. The NM-EPD-420 fits
  # a LoRa module, an ES8311 codec, an audio PA and an AHT20, all active-HIGH
  # enabled (GPIO47 MODULE_EN, GPIO44 CODEC_EN, GPIO41 PA_CTRL, GPIO40 TEMP_CTL)
  # LoRa/audio remain unused; AHT20 is powered only for a wake-time measurement.
  # Without the flag these gates would be left at the
  # ESP32 reset default (input, no pull) and float the rails on.
  # GPIO43 (ADC_EN) also defaults LOW; battery sampling pulses it HIGH briefly.
  device_flags: 0x20      # bit5 = NM420 init; no display power switch, no XIAO/WS init, no battery latch
  pwr_pin: 0xFF
  pwr_pin_2: 0xFF
  pwr_pin_3: 0xFF

manufacturer_data:
  manufacturer_id: 0      # OD_MANUFACTURER_DIY — RockBase is not in the ManufacturerId table yet
  board_type: 0
  board_revision: 1
  # simple_config_* indices are written by the opendisplay.org toolbox when a
  # user picks this board there; left at 0 for a hand-flashed config.

power_option:
  power_mode: 1           # OD_POWER_MODE_BATTERY
  battery_capacity_mah: 600
  sleep_timeout_ms: 40000
  tx_power: 8
  sleep_flags: 0x0     # Allow configured button wake; GPIO0 BOOT is an ESP32-S3 RTC wake pin
  # Battery sense: GPIO3 through a 1:2 divider, gated by GPIO43 (PIN_ADC_EN,
  # active HIGH). ESP32-S3 ADC is 12-bit @ 11 dB (~3.3 V full scale), so
  # scaling = 3.3 V / 4095 counts * 2 (divider) = 0.001612 V/count
  #        -> voltage_scaling_factor = 161, the same value the M5Stack PaperS3
  #           preset uses (identical pin + identical divider).
  battery_sense_pin: 3
  battery_sense_enable_pin: 43
  battery_sense_flags: 0x0
  capacity_estimator: 1   # OD_CAPACITY_EST_LI_ION
  voltage_scaling_factor: 161
  deep_sleep_current_ua: 0
  deep_sleep_time_seconds: 1800  # 30-minute timer fallback; GPIO0 BOOT also wakes from deep sleep
  # No charger GPIOs are exposed on the NM-EPD-420 (charge management is
  # standalone on-board), so no charge_enable_pin / charge_state_pin.
  charge_enable_pin: 0xFF
  charge_state_pin: 0xFF
  charger_flags: 0x0
  screen_timeout_seconds: 0   # 4-colour panel: power the panel straight down after a refresh

displays:
  - instance_number: 0
    display_technology: 1     # OD_DISPLAY_TECH_E_PAPER
    # 58 = OD_PANEL_IC_EP42YR_400X300 ("4.2\" BWRY 400x300", bb_epaper
    # EP42YR_400x300 - the Good Display 4.2" four-colour class: JD79668 /
    # GDEM042F52, and the GDEY0420F51 (HX8717) it replaces). Same value the
    # opendisplay.org preset `ep42yr-400x300` (index 11) carries.
    panel_ic_type: 58
    pixel_width: 400
    pixel_height: 300
    # Panel datasheet active area is 84.8 x 63.6 mm. Deliberately rounded the
    # same way the opendisplay.org preset `ep42yr-400x300` rounds it, so a device
    # flashed from this file and a device configured from the preset agree
    # byte-for-byte.
    active_width_mm: 84
    active_height_mm: 63
    legacy_tag_type: 0
    rotation: 0
    reset_pin: 5
    busy_pin: 6
    dc_pin: 4
    cs_pin: 46
    data_pin: 1
    clk_pin: 2
    cs_pin_2: 0xFF
    # Four-colour panels have no usable partial refresh (25-30 s full update,
    # and the protocol's partial path is 1bpp-only anyway).
    partial_update_support: 0
    color_scheme: 3           # OD_COLOR_SCHEME_BWRY -> 2 bpp
    # streaming decompression (bit0) | direct write (bit3) | pipe write (bit4)
    transmission_modes: 25
    full_update_mC: 165

data_buses:
  # AHT20 (0x38) and the disabled ES8311 (0x18) share this bus.
  - instance_number: 0
    bus_type: 1               # OD_BUS_TYPE_I2C
    pin_1: 38                 # SCL
    pin_2: 39                 # SDA
    pin_3: 0xFF
    pin_4: 0xFF
    pin_5: 0xFF
    pin_6: 0xFF
    pin_7: 0xFF
    bus_speed_hz: 400000
    bus_flags: 0x0
    pullups: 0x0
    pulldowns: 0x0

sensors:
  - instance_number: 0
    sensor_type: 7         # OD_SENSOR_TYPE_AHT20; 6 is nPM1300 on other firmware
    bus_id: 0
    i2c_addr_7bit: 0x38
    msd_data_start_byte: 7 # 3-byte SHT40-compatible temperature/humidity snapshot

binary_inputs:
  # USER key on GPIO45, active LOW with an external pull-up.
  # BOOT key on GPIO0 is also active LOW. It is an ESP32-S3 ROM-download
  # strap, so keep it released at reset; it is otherwise valid for RTC wake.
  # button_data_byte_index 0 publishes the button state into MSD dynamic byte 0;
  # >10 disables the input entirely.
  - instance_number: 0
    input_type: 1             # OD_INPUT_TYPE_BUTTON
    display_as: 1             # OD_INPUT_DISPLAY_AS_BUTTON
    input_pin_1: 45
    input_pin_2: 0
    input_pin_3: 0xFF
    input_pin_4: 0xFF
    input_pin_5: 0xFF
    input_pin_6: 0xFF
    input_pin_7: 0xFF
    input_pin_8: 0xFF
    pins_used: 0x3
    invert: 0x3               # pressed = LOW
    pullups: 0x0
    pulldowns: 0x0
    button_data_byte_index: 0
    power_off_flags: 0x0
    power_off_hold_sec: 0
